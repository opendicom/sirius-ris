<form class="form-element" #form_data="ngForm" (ngSubmit)="onSubmit(form_data)">
  <ng-container *ngIf="sharedFunctions.getLogoDataURI(lastWhiteLabeling?.base64_logo_vertical) as customLogo; else defaultAuthorizeLogo">
    <img [src]="customLogo" alt="Authorize">
  </ng-container>
  <ng-template #defaultAuthorizeLogo>
    <img src="../../../../assets/img/logo_vertical.png" alt="Authorize">
  </ng-template>
  <div *ngIf="lastWhiteLabeling?.label" class="authorize-org-label">{{ lastWhiteLabeling.label }}</div>

  <br/><br/><hr class="dashed" /><br/>

  <mat-form-field appearance="fill" class="sub-element">
    <mat-label>{{ 'AUTH.DOMAIN' | i18n }}</mat-label>
    <mat-select name="domain" (selectionChange)="onChangeDomain($event)" ngModel required>
      <div *ngFor="let currentDomain of availableDomains | keyvalue">
        <mat-option value="{{ currentDomain.key }}">{{ currentDomain.value }}</mat-option>
      </div>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="sub-element">
    <mat-label>{{ 'AUTH.ROLE' | i18n }}</mat-label>
    <mat-select name="role" [disabled]="RoleDisabled" ngModel required>
      <div *ngFor="let currentRole of availableRoles | keyvalue">
        <mat-option value="{{ currentRole.key }}">{{ currentRole.value }}</mat-option>
      </div>
    </mat-select>
  </mat-form-field>

  <br/>

  <button mat-flat-button color="primary" class="sub-element submit-button" type="submit">{{ 'AUTH.SELECT' | i18n }}</button>
  <br/><br/>
  <button mat-flat-button color="accent" class="sub-element submit-button" type="button" (click)="onCancel()">{{ 'AUTH.CANCEL' | i18n }}</button>
</form>
