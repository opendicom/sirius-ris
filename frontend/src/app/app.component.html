<div *ngIf="sharedProp.isLogged; then thenBlock else elseBlock"></div>

<ng-template #thenBlock>
<!-- ------------------------------------------------------------------------------------------------------------------------ -->
<!-- MAIN TOOLBAR -->
<!-- ------------------------------------------------------------------------------------------------------------------------ -->
<mat-toolbar class="main-toolbar" color="primary">
  <button mat-icon-button mat-button (click)="drawerSidebar.toggle(); sharedFunctions.fixFullCalendarRender(250);">
    <mat-icon>menu</mat-icon>
  </button>

  <span>&nbsp;|&nbsp;&nbsp;</span>

  <!-- Custom horizontal logo (when configured) -->
  <ng-container *ngIf="sharedFunctions.getLogoDataURI(sharedProp.userLogged?.permissions?.[0]?.white_labeling?.base64_logo_horizontal) as customLogo">
    <img class="logo" [src]="customLogo" routerLink="/start" />
  </ng-container>
  <!-- Default Sirius RIS logo (when no custom horizontal logo uploaded) -->
  <ng-container *ngIf="!sharedProp.userLogged?.permissions?.[0]?.white_labeling?.base64_logo_horizontal">
    <img class="logo" src="../assets/img/logo_horizontal.png" routerLink="/start" />
  </ng-container>
  <!-- Brand label text: shown alongside logo when both are set, or alone when only label is set -->
  <ng-container *ngIf="sharedProp.userLogged?.permissions?.[0]?.white_labeling?.label">
    <span class="nav-brand-label" routerLink="/start">{{ sharedProp.userLogged.permissions[0].white_labeling.label }}</span>
  </ng-container>

  <span class="mat-spacer"></span>

  <div fxLayout="row" fxLayoutAlign="end center">
    <app-header></app-header>
  </div>
</mat-toolbar>
<!-- ------------------------------------------------------------------------------------------------------------------------ -->


<!-- ------------------------------------------------------------------------------------------------------------------------ -->
<!-- MAIN CONTAINER -->
<!-- ------------------------------------------------------------------------------------------------------------------------ -->
<mat-drawer-container class="main-container">
  <mat-drawer #drawerSidebar class="main-sidenav" mode="side" opened="true">
    <app-sidenav></app-sidenav>
  </mat-drawer>

  <div class="main-content">
    <app-action></app-action>
    <router-outlet></router-outlet>
  </div>

  <app-footer></app-footer>
</mat-drawer-container>
<!-- ------------------------------------------------------------------------------------------------------------------------ -->
</ng-template>

<!-- ------------------------------------------------------------------------------------------------------------------------ -->
<!-- SIGNIN CONTAINER -->
<!-- ------------------------------------------------------------------------------------------------------------------------ -->
<ng-template #elseBlock>
  <router-outlet></router-outlet>
  <app-footer></app-footer>
</ng-template>
<!-- ------------------------------------------------------------------------------------------------------------------------ -->
