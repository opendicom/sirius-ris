<form class="form-element" [formGroup]="form">
    <mat-form-field appearance="outline">
        <mat-label>{{ 'STATS.BRANCH' | i18n }}</mat-label>
        <input #inputBranch type="text" matInput formControlName="fk_branch_input" (focus)="filterBranches($event)" (keyup)="filterBranches($event)" [matAutocomplete]="autoBranch" placeholder="{{ 'STATS.SELECT_BRANCH' | i18n }}" class="auto-width">
        <mat-autocomplete #autoBranch="matAutocomplete">
          <mat-option (onSelectionChange)="selectBranch(currentBranch)" *ngFor="let currentBranch of filteredBranches" [value]="statsService.getBranchLabel(currentBranch)">
            <span [innerHTML]="statsService.getBranchLabel(currentBranch) | highlighter : inputBranch.value"></span>
          </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>{{ 'STATS.SELECT_DATE_RANGE' | i18n }}</mat-label>
        <mat-date-range-input [rangePicker]="picker" (click)="picker.open()">
        <input matStartDate formControlName="range_start" readonly placeholder="{{ 'STATS.START_DATE' | i18n }}">
        <input matEndDate formControlName="range_end" readonly placeholder="{{ 'STATS.END_DATE' | i18n }}">
        </mat-date-range-input>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>

    <button mat-flat-button color="primary" class="button_filters" (click)="onSearch();">
        <mat-icon>search</mat-icon>&nbsp; {{ 'STATS.SEARCH' | i18n }}
    </button>
</form>

<hr class="dashed"/>

<div *ngIf="getKeys(avgDelayReportsStatsResponse).length > 0; then thenStatsResult else elseStatsResult"></div>

<ng-template #thenStatsResult>
    <!-- summary -->
    <div class="summary">
        {{ 'STATS.TOTAL_AVG_DELAY' | i18n }} <strong>{{ avgDelayReportsStatsResponse['total-avg-days-passed'] }}</strong>
    </div>

    <!-- modalities -->
    <div class="chart-responsive chart-col-100">
        <h2 class="text-center">{{ 'STATS.AVG_DELAY_BY_MODALITY' | i18n }}</h2>
        <div #modalitiesContainerRef class="chart-wrapper">
            <ngx-charts-bar-vertical
                [view]="[modalitiesContainerRef.offsetWidth, 400]"
                [results]="datasets.modalities"
                [gradient]="true"
                [xAxis]="true"
                [yAxis]="true">
            </ngx-charts-bar-vertical>
        </div>
    </div>

    <div class="clear"></div>
    <br/><hr class="dashed"/><br/>

    <!-- Export to XSLX -->
    <div class="text-right">
        <button mat-flat-button class="button_filters" (click)="sharedFunctions.jsonToXLSX(datasets, 'stats_result');">
            <mat-icon class="export-icon">get_app</mat-icon> {{ 'STATS.EXPORT' | i18n }}
        </button>
    </div>
</ng-template>

<ng-template #elseStatsResult>
    <div class="text-center">
        <br/>
        <mat-icon class="no-result-icon">query_stats</mat-icon><br/>
        <span class="no-result-text">{{ 'STATS.NO_RESULTS' | i18n }}</span><br/>
        <br/>
    </div>
</ng-template>
